<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Step – Professional Spiritual Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #081c15; --accent: #d4a373; --bg: #f8fafc;
            --fajr: linear-gradient(135deg, #2c3e50, #4ca1af);
            --dhuhr: linear-gradient(135deg, #134e5e, #71b280);
            --asr: linear-gradient(135deg, #ba8b02, #181818);
            --maghrib: linear-gradient(135deg, #870000, #190a05);
            --isha: linear-gradient(135deg, #0f0c29, #302b63);
            --grad-w: linear-gradient(135deg, #576574, #222f3e);
            --grad-m: linear-gradient(135deg, #0f4c5c, #081c15);
        }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 10px; font-size: 13px; color: #1e293b; }
        .wrapper { max-width: 480px; margin: 0 auto; background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }

        .header { background: var(--primary); color: white; padding: 25px 15px; text-align: center; border-bottom: 5px solid var(--accent); }
        .header h1 { margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
        .header p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.8; font-weight: 300; }

        .streak-dashboard { margin: 15px; padding: 15px; background: linear-gradient(135deg, #081c15, #1b4332); border-radius: 15px; color: white; border: 1px solid rgba(212,163,115,0.3); }
        .streak-title { text-align: center; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; color: var(--accent); }
        .streak-stats { display: flex; gap: 10px; }
        .stat-box { flex: 1; background: rgba(255,255,255,0.08); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-box b { font-size: 1.5rem; display: block; color: #fff; }
        .stat-box span { font-size: 0.6rem; opacity: 0.7; text-transform: uppercase; }

        .date-bar { text-align: center; font-weight: 700; color: #64748b; padding: 6px; background: #f1f5f9; font-size: 0.75rem; border-bottom: 1px solid #e2e8f0; }

        .prayer-card { margin: 12px; border-radius: 18px; padding: 15px; color: white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .prayer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; padding-bottom: 5px; }
        .prayer-header h3 { margin: 0; font-size: 1.1rem; font-weight: 800; }
        .seq-badge { background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }

        .row { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin-bottom: 8px; }
        .q-text { font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; display: block; }

        .btns { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .btn-yes { background: #fff; color: #2ecc71; }
        .btn-no { background: #fff; color: #e74c3c; }
        .active-yes { background: #2ecc71 !important; color: white !important; }
        .active-no { background: #e74c3c !important; color: white !important; }

        .arabic { font-family: 'Amiri', serif; font-size: 1.1rem; display: block; direction: rtl; margin-top: 5px; text-align: right; }
        .meaning { font-size: 0.7rem; opacity: 0.9; font-style: italic; display: block; margin-top: 2px; }

        /* Report Gradient Boxes */
        .report-box { margin: 15px; padding: 18px; border-radius: 15px; color: white; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .report-box:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .report-box h4 { margin: 0 0 8px 0; font-size: 1rem; font-weight: 800; text-transform: uppercase; }
        .report-box p { margin: 0; font-size: 0.75rem; opacity: 0.8; }
        .w-box { background: var(--grad-w); border-left: 5px solid #bdc3c7; }
        .m-box { background: var(--grad-m); border-left: 5px solid var(--accent); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>NOOR STEP</h1>
        <p>Salah Tracker & Spiritual Consistency Tool</p>
    </div>

    <div class="date-bar" id="dateDisplay">--/--/----</div>

    <div class="streak-dashboard">
        <div class="streak-title">Live Tracking Streak</div>
        <div class="streak-stats">
            <div class="stat-box"><b id="compCount">0</b><span>Completed</span></div>
            <div class="stat-box"><b id="missCount">5</b><span>Remaining</span></div>
        </div>
    </div>

    <div id="prayerCardsArea"></div>

    <div class="report-box w-box" onclick="generatePDF(7)">
        <h4>Download Weekly Report</h4>
        <p>Generate PDF of your last 7 days performance</p>
    </div>

    <div class="report-box m-box" onclick="generatePDF(30)">
        <h4>Download Monthly Report</h4>
        <p>Full spiritual tracking history for the month</p>
    </div>
</div>

<script>
    const prayerConfig = [
        { id: 'fajr', name: 'Fajr', theme: 'var(--fajr)', surah: 'Surah Yasin' },
        { id: 'dhuhr', name: 'Dhuhr', theme: 'var(--dhuhr)', surah: null },
        { id: 'asr', name: 'Asr', theme: 'var(--asr)', surah: null },
        { id: 'maghrib', name: 'Maghrib', theme: 'var(--maghrib)', surah: 'Surah Waqiya' },
        { id: 'isha', name: 'Isha', theme: 'var(--isha)', surah: 'Surah Mulk' }
    ];

    const todayKey = new Date().toISOString().split('T')[0];
    document.getElementById('dateDisplay').innerText = "📅 " + new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});

    let masterData = JSON.parse(localStorage.getItem('noorStepPro')) || {};
    if (!masterData[todayKey]) masterData[todayKey] = {};

    function init() {
        const area = document.getElementById('prayerCardsArea');
        prayerConfig.forEach((p, index) => {
            const card = document.createElement('div');
            card.className = 'prayer-card';
            card.style.background = p.theme;
            
            card.innerHTML = `
                <div class="prayer-header">
                    <h3>${p.name}</h3> 
                    <span class="seq-badge">${index + 1}/5</span>
                </div>
                
                ${renderRow(p.id, 'namaz', `Did you pray ${p.name}?`)}
                ${renderRow(p.id, 'ayat', `Recited Ayatul Kursi?`)}
                ${p.surah ? renderRow(p.id, 'surah', `Recited ${p.surah}?`) : ''}

                <div class="row">
                    <span class="q-text">Completed Tasbih Azkar?</span>
                    <span class="arabic">سُبْحَانَ اللَّهِ | الْحَمْدُ لِلَّهِ | اللَّهُ أَكْبَرُ</span>
                    <span class="meaning">SubhanAllah (33), Alhamdulillah (33), AllahuAkbar (34)</span>
                    <div class="btns" style="margin-top:10px;">
                        <button class="btn btn-yes" id="${p.id}-zikr-yes" onclick="mark('${p.id}','zikr','yes')">Yes</button>
                        <button class="btn btn-no" id="${p.id}-zikr-no" onclick="mark('${p.id}','zikr','no')">No</button>
                    </div>
                </div>
            `;
            area.appendChild(card);
            restore(p.id);
        });
        updateStats();
    }

    function renderRow(pid, type, q) {
        return `<div class="row">
            <span class="q-text">${q}</span>
            <div class="btns">
                <button class="btn btn-yes" id="${pid}-${type}-yes" onclick="mark('${pid}','${type}','yes')">Yes</button>
                <button class="btn btn-no" id="${pid}-${type}-no" onclick="mark('${pid}','${type}','no')">No</button>
            </div>
        </div>`;
    }

    function mark(pid, type, val) {
        if (!masterData[todayKey][pid]) masterData[todayKey][pid] = {};
        masterData[todayKey][pid][type] = val;
        localStorage.setItem('noorStepPro', JSON.stringify(masterData));
        applyUI(pid, type, val);
        updateStats();
    }

    function applyUI(pid, type, val) {
        const y = document.getElementById(`${pid}-${type}-yes`);
        const n = document.getElementById(`${pid}-${type}-no`);
        if(y) y.classList.toggle('active-yes', val === 'yes');
        if(n) n.classList.toggle('active-no', val === 'no');
    }

    function restore(pid) {
        const d = masterData[todayKey][pid] || {};
        Object.keys(d).forEach(t => applyUI(pid, t, d[t]));
    }

    function updateStats() {
        let comp = 0;
        prayerConfig.forEach(p => {
            const d = masterData[todayKey][p.id] || {};
            const isPerf = (d.namaz==='yes' && d.ayat==='yes' && d.zikr==='yes' && (p.surah ? d.surah==='yes' : true));
            if (isPerf) comp++;
        });
        document.getElementById('compCount').innerText = comp;
        document.getElementById('missCount').innerText = 5 - comp;
    }

    async function generatePDF(days) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(22);
        doc.setTextColor(8, 28, 21);
        doc.text("NOOR STEP - PERFORMANCE REPORT", 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text("Spiritual consistency summary for the requested period.", 14, 28);

        const rows = [];
        const sortedDates = Object.keys(masterData).sort().reverse().slice(0, days);

        sortedDates.forEach(date => {
            let dComp = 0;
            prayerConfig.forEach(p => {
                const d = masterData[date][p.id] || {};
                if (d.namaz==='yes' && d.ayat==='yes' && d.zikr==='yes' && (p.surah ? d.surah==='yes' : true)) dComp++;
            });
            rows.push([date, `${dComp} / 5 Prayers`, (5 - dComp) === 0 ? "Perfect Day" : (5 - dComp) + " Missing"]);
        });

        doc.autoTable({
            startY: 35,
            head: [['Date', 'Completed Streak', 'Status']],
            body: rows,
            headStyles: { fillColor: [8, 28, 21] },
            theme: 'grid'
        });

        doc.save(`NoorStep_Report_${days}Days.pdf`);
    }

    init();
</script>
</body>
</html>
